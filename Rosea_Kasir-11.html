<!doctype html><html lang='id'><head><meta charset='utf-8'><meta name='viewport' content='width=device-width,initial-scale=1'><title>Rosea Kasir</title><style>
*{box-sizing:border-box}body{margin:0;background:#f7f7f7;font-family:Arial,sans-serif;color:#222}.app{max-width:600px;margin:auto;background:#fff;min-height:100vh}.head{background:#e66a97;color:white;padding:18px;position:sticky;top:0;z-index:3}.brand{font-size:25px;font-weight:800}.sub{font-size:12px}.tabs{display:flex;gap:8px;margin-top:12px}.tabs button{border:0;border-radius:18px;padding:9px 14px;font-weight:700}.tabs .on{color:#d65083}.main{padding:12px 12px 210px}.quick{display:flex;gap:7px;overflow:auto;padding-bottom:10px;position:sticky;top:78px;background:#fff;z-index:2}.quick button{white-space:nowrap;border:1px solid #f0c9d8;background:#fff7fa;color:#b94773;border-radius:18px;padding:9px 13px;font-weight:800}.quick button.on{background:#e66a97;color:#fff}.count{font-size:12px;color:#888;margin:4px 0 10px}.item{min-height:118px}.name{min-height:38px}.size button{font-size:12px;line-height:1.25}.single{font-size:13px}.grid{grid-template-columns:repeat(2,minmax(0,1fr))}.search{width:100%;padding:13px;border:1px solid #ddd;border-radius:12px;margin-bottom:12px;font-size:15px}.cat{font-weight:800;color:#c84e7d;margin:16px 0 8px}.grid{display:grid;grid-template-columns:1fr 1fr;gap:9px}.item{border:1px solid #eee;border-radius:13px;padding:11px}.name{font-weight:700;font-size:14px;min-height:34px}.size{display:flex;gap:6px;margin-top:8px}.size button,.add{border:0;border-radius:8px;background:#fff0f5;color:#c94d7b;padding:8px;font-weight:700}.size button{flex:1}.single{width:100%;margin-top:8px}.cart{position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:min(600px,100%);background:white;border-top:1px solid #ddd;padding:10px 14px 14px;z-index:5;box-shadow:0 -4px 18px #0001}.cartlist{max-height:120px;overflow:auto}.line{display:flex;justify-content:space-between;padding:5px 0;border-bottom:1px dashed #ddd;font-size:13px}.qty button{border:0;border-radius:7px;background:#f4d8e3;width:27px;height:27px;font-weight:bold}.total{display:flex;justify-content:space-between;font-size:20px;font-weight:900;margin-top:8px}.pay{display:flex;gap:7px;margin-top:8px}.pay input{flex:1;padding:11px;border:1px solid #ddd;border-radius:9px;font-size:16px}.btn{border:0;border-radius:9px;padding:11px 14px;font-weight:800}.pink{background:#e66a97;color:white}.history{padding:10px;border:1px solid #eee;border-radius:10px;margin-bottom:8px}.empty{text-align:center;color:#999;padding:14px}@media(min-width:700px){body{padding:20px}}
</style></head><body><div class='app'><header class='head'><div class='brand'>🌹 ROSEA</div><div class='sub'>JUICE & DRINK • KASIR</div><div class='tabs'><button id='tk' class='on' onclick='tab("kasir")'>Kasir</button><button id='th' onclick='tab("riwayat")'>Riwayat</button></div></header><main class='main'><section id='kasir'><input id='search' class='search' placeholder='🔎 Cari nama minuman...' oninput='render()'><div id='quick' class='quick'></div><div id='count' class='count'></div><div id='menu'></div></section><section id='riwayat' style='display:none'><h3>Riwayat Transaksi Per Hari</h3><div style='display:flex;gap:7px;flex-wrap:wrap;align-items:center;margin-bottom:10px'><label style='font-size:13px;font-weight:bold'>Pilih tanggal:</label><input id='histDate' type='date' onchange='renderHistory()' style='padding:9px;border:1px solid #ddd;border-radius:10px'><button class='btn pink' onclick='exportExcel()'>📊 Salin Hari Ini ke Excel</button><button class='btn' style='border:1px solid #ddd;background:#fff' onclick='printHistory()'>🖨️ Print Hari Ini</button><button class='btn' style='border:1px solid #ddd;background:#fff' onclick='downloadBackup()'>💾 Backup</button><label class='btn' style='border:1px solid #ddd;background:#fff;cursor:pointer'>↩️ Pulihkan<input type='file' accept='.json,application/json' onchange='restoreBackup(this)' style='display:none'></label><button class='btn' style='border:1px solid #ddd;background:#fff' onclick='clearHistory()'>Hapus Riwayat</button></div><div id='hist'></div></section></main><div class='cart'><div id='cartlist' class='cartlist'><div class='empty'>Belum ada pesanan</div></div><div class='total'><span>Total</span><span id='total'>Rp0</span></div><div class='pay'><input id='cash' type='number' inputmode='numeric' placeholder='Uang bayar'><button class='btn pink' onclick='pay()'>BAYAR & CETAK</button></div><div id='change' style='text-align:right;font-weight:bold;margin-top:5px'></div></div></div>
<script>
const data={
'TEA':[['Teh Original','Besar',5000],['Teh Hijau','Besar',5000],['Teh Susu','Kecil',5000],['Teh Susu','Besar',8000],['Teh Tarik','Kecil',6000],['Teh Tarik','Besar',8000],['Teh Kurma','Kecil',6000],['Teh Kurma','Besar',10000],['Lemon Tea','Kecil',6000],['Lemon Tea','Besar',10000],['Apple Tea','Kecil',5000],['Apple Tea','Besar',10000],['Markisa Tea','Kecil',5000],['Markisa Tea','Besar',8000],['Lecy Tea','Kecil',5000],['Lecy Tea','Besar',8000],['Strawberry Tea','Kecil',5000],['Strawberry Tea','Besar',8000]],
'MILK & FLAVOR':[['Thai Tea','Kecil',8000],['Thai Tea','Besar',10000],['Chocolate','Kecil',8000],['Chocolate','Besar',10000],['Matcha','Kecil',8000],['Matcha','Besar',10000],['Taro','Kecil',8000],['Taro','Besar',10000],['Red Velvet','Kecil',10000],['Red Velvet','Besar',8000],['Coffee Gula Aren','Besar',10000],['Extra Joss Susu','Kecil',6000],['Extra Joss Susu','Besar',10000],['Kuku Bima Susu','Kecil',6000],['Kuku Bima Susu','Besar',10000],['Milo','',10000],['Nescafé + Milo','',10000],['Nescafé Americano','',8000],['Nescafé Gula Aren','',10000],['Boba Brown Sugar','',10000]],
'SEGAR & TRADISIONAL':[['Jeruk Yakult','',10000],['Jeruk Peras','Kecil',5000],['Jeruk Peras','Besar',10000],['Es Jagung Hawai','Kecil',7000],['Es Jagung Hawai','Besar',10000],['Cappuccino Cincau','Kecil',7000],['Cappuccino Cincau','Besar',10000],['Dawet Gula Aren','Kecil',7000],['Dawet Gula Aren','Besar',10000],['Cincau Gula Aren','Kecil',7000],['Cincau Gula Aren','Besar',10000]],
'KOCOK':[['Alpukat Kocok','',12000],['Naga Kocok','',12000]],
'JUICE':[['Jus Alpukat','Kecil',9000],['Jus Alpukat','Besar',14000],['Jus Naga','Kecil',8000],['Jus Naga','Besar',13000],['Jus Mangga','Kecil',8000],['Jus Mangga','Besar',13000],['Jus Strawberry','Kecil',8000],['Jus Strawberry','Besar',13000],['Jus Melon','Kecil',7000],['Jus Melon','Besar',12000],['Jus Semangka','Kecil',7000],['Jus Semangka','Besar',12000],['Jus Apel','Kecil',8000],['Jus Apel','Besar',12000]]};
let cart={},history=[]; const rp=n=>'Rp'+n.toLocaleString('id-ID');
const DB_NAME='RoseaKasirDB',DB_VER=1,STORE='transactions';
let dbReady=null;
function openDB(){return dbReady||(dbReady=new Promise((resolve,reject)=>{let r=indexedDB.open(DB_NAME,DB_VER);r.onupgradeneeded=()=>{let db=r.result;if(!db.objectStoreNames.contains(STORE))db.createObjectStore(STORE,{keyPath:'id'})};r.onsuccess=()=>resolve(r.result);r.onerror=()=>reject(r.error)}))}
async function loadHistory(){try{let db=await openDB();history=await new Promise((res,rej)=>{let q=db.transaction(STORE,'readonly').objectStore(STORE).getAll();q.onsuccess=()=>res(q.result.sort((a,b)=>b.id-a.id));q.onerror=()=>rej(q.error)});if(!history.length){let old=JSON.parse(localStorage.roseaHistory||'[]');if(old.length){let tx=db.transaction(STORE,'readwrite').objectStore(STORE);old.forEach(x=>tx.put(x));history=old.sort((a,b)=>b.id-a.id)}}localStorage.roseaHistory=JSON.stringify(history.slice(0,100));renderHistory()}catch(e){history=JSON.parse(localStorage.roseaHistory||'[]');renderHistory()}}
async function saveTx(tx){let db=await openDB();await new Promise((res,rej)=>{let q=db.transaction(STORE,'readwrite').objectStore(STORE).put(tx);q.onsuccess=()=>res();q.onerror=()=>rej(q.error)});history.unshift(tx);history=history.slice(0,100);localStorage.roseaHistory=JSON.stringify(history)}
async function deleteAllTx(){let db=await openDB();await new Promise((res,rej)=>{let q=db.transaction(STORE,'readwrite').objectStore(STORE).clear();q.onsuccess=()=>res();q.onerror=()=>rej(q.error)});history=[];localStorage.roseaHistory='[]'}
function downloadBackup(){let blob=new Blob([JSON.stringify({app:'Rosea Kasir',version:1,exportedAt:new Date().toISOString(),transactions:history},null,2)],{type:'application/json'});let a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='Rosea_Backup_Riwayat.json';a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000)}
function restoreBackup(input){let f=input.files[0];if(!f)return;let r=new FileReader();r.onload=async()=>{try{let obj=JSON.parse(r.result),arr=Array.isArray(obj)?obj:obj.transactions;if(!Array.isArray(arr))throw 0;let db=await openDB(),st=db.transaction(STORE,'readwrite').objectStore(STORE);arr.forEach(x=>st.put(x));await new Promise((res,rej)=>{st.transaction.oncomplete=res;st.transaction.onerror=()=>rej(st.transaction.error)});await loadHistory();alert('Backup berhasil dipulihkan: '+arr.length+' transaksi.')}catch(e){alert('File backup tidak valid.')}};r.readAsText(f);input.value=''}
function all(){return Object.entries(data).flatMap(([c,arr])=>arr.map(x=>[c,...x]))}
function key(n,s){return n+(s?' - '+s:'')}
function add(n,s,p){let k=key(n,s);cart[k]??={n,s,p,q:0};cart[k].q++;drawCart()}
let activeCat='SEMUA';
function renderQuick(){let cats=['SEMUA',...Object.keys(data)];document.getElementById('quick').innerHTML=cats.map(c=>`<button class='${activeCat===c?'on':''}' onclick=\"activeCat='${c}';renderQuick();render()\">${c}</button>`).join('')}
function render(){let q=document.getElementById('search').value.toLowerCase().trim();let h='',shown=0;for(let [cat,arr] of Object.entries(data)){if(activeCat!=='SEMUA'&&activeCat!==cat)continue;let f=arr.filter(x=>x[0].toLowerCase().includes(q));if(!f.length)continue;shown+=f.length;h+=`<div class='cat'>${cat}</div><div class='grid'>`;let grouped={};f.forEach(x=>(grouped[x[0]]??=[]).push(x));for(let [n,opts] of Object.entries(grouped)){h+=`<div class='item'><div class='name'>${n}</div>`;if(opts.length>1){h+=`<div class='size'>${opts.map(x=>`<button onclick=\"add('${n.replaceAll("'","\\'")}','${x[1]}',${x[2]})\">${x[1]}<br>${rp(x[2])}</button>`).join('')}</div>`}else{let x=opts[0];h+=`<button class='add single' onclick=\"add('${n.replaceAll("'","\\'")}','${x[1]}',${x[2]})\">${x[1]?x[1]+' • ':''}${rp(x[2])} &nbsp; +</button>`}h+='</div>'}h+='</div>'}document.getElementById('menu').innerHTML=h||'<div class=\"empty\">Menu tidak ditemukan</div>';document.getElementById('count').textContent=shown+' pilihan menu';renderQuick()}
function drawCart(){let el=document.getElementById('cartlist'),ks=Object.keys(cart);el.innerHTML=ks.length?ks.map(k=>`<div class='line'><span>${k}<br><b>${rp(cart[k].p*cart[k].q)}</b></span><span class='qty'><button onclick="dec('${k.replaceAll("'","\\'")}')">−</button> ${cart[k].q} <button onclick="cart['${k.replaceAll("'","\\'")}'].q++;drawCart()">+</button></span></div>`).join(''):'<div class="empty">Belum ada pesanan</div>';let t=ks.reduce((s,k)=>s+cart[k].p*cart[k].q,0);document.getElementById('total').textContent=rp(t);change()}
function dec(k){if(--cart[k].q<=0)delete cart[k];drawCart()}function change(){let t=Object.values(cart).reduce((s,x)=>s+x.p*x.q,0),c=+cash.value||0;document.getElementById('change').textContent=c>=t&&c?'Kembalian: '+rp(c-t):''}cash.oninput=change;
function pay(){let ks=Object.keys(cart),t=ks.reduce((s,k)=>s+cart[k].p*cart[k].q,0),c=+cash.value||0;if(!ks.length)return alert('Belum ada pesanan.');if(c<t)return alert('Uang bayar kurang.');let now=new Date(),tx={id:Date.now(),dateKey:now.toISOString().slice(0,10),time:now.toLocaleString('id-ID'),items:ks.map(k=>({name:k,q:cart[k].q,p:cart[k].p})),total:t,cash:c,change:c-t};saveTx(tx).then(()=>{printReceipt(tx);renderHistory()}).catch(()=>alert('Gagal menyimpan transaksi.'));cart={};cash.value='';drawCart()}
function printReceipt(tx){let rows=tx.items.map(x=>`<tr><td>${x.name} x${x.q}</td><td style='text-align:right'>${rp(x.p*x.q)}</td></tr>`).join('');let w=window.open('','_blank','width=380,height=650');w.document.write(`<html><head><title>Struk Rosea</title><style>body{font-family:monospace;width:280px;margin:15px auto;font-size:12px}.c{text-align:center}.line{border-top:1px dashed #000;margin:8px 0}table{width:100%;border-collapse:collapse}td{padding:3px 0}.big{font-size:16px;font-weight:bold}</style></head><body><div class='c'><div class='big'>🌹 ROSEA</div><div>JUICE & DRINK</div><div>${tx.time}</div></div><div class='line'></div><table>${rows}</table><div class='line'></div><table><tr><td>TOTAL</td><td style='text-align:right'><b>${rp(tx.total)}</b></td></tr><tr><td>BAYAR</td><td style='text-align:right'>${rp(tx.cash)}</td></tr><tr><td>KEMBALI</td><td style='text-align:right'>${rp(tx.change)}</td></tr></table><div class='line'></div><div class='c'>Terima kasih 🙏<br>ROSEA Juice & Drink</div><script>window.onload=()=>{window.print();setTimeout(()=>window.close(),500)}<\/script></body></html>`);w.document.close()}

function getSelectedDate(){let el=document.getElementById('histDate');if(!el)return new Date().toISOString().slice(0,10);return el.value||new Date().toISOString().slice(0,10)}
function txDate(x){if(x.dateKey)return x.dateKey;let d=new Date(x.id);return d.toISOString().slice(0,10)}
function dayHistory(){let d=getSelectedDate();return history.filter(x=>txDate(x)===d)}
function formatDay(d){let p=d.split('-');return p[2]+'-'+p[1]+'-'+p[0]}
function exportExcel(){let list=dayHistory();if(!list.length)return alert('Tidak ada transaksi pada tanggal '+formatDay(getSelectedDate())+'.');let rows=[['Tanggal','No Transaksi','Menu','Jumlah','Harga Satuan','Subtotal','Total Transaksi','Uang Bayar','Kembalian']];list.forEach(x=>x.items.forEach((i,j)=>rows.push([x.time,x.id,i.name,i.q,i.p,i.p*i.q,j===0?x.total:'',j===0?x.cash:'',j===0?x.change:''])));let csv='\ufeff'+rows.map(r=>r.map(v=>'"'+String(v).replaceAll('"','""')+'"').join(';')).join('\r\n');let a=document.createElement('a');a.href=URL.createObjectURL(new Blob([csv],{type:'text/csv;charset=utf-8'}));a.download='Rosea_Riwayat_'+getSelectedDate()+'.csv';a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000)}
function printHistory(){let list=dayHistory();if(!list.length)return alert('Tidak ada transaksi pada tanggal '+formatDay(getSelectedDate())+'.');let totalDay=list.reduce((s,x)=>s+x.total,0),rows=list.map(x=>`<tr><td>${x.time}</td><td>${x.items.map(i=>i.name+' x'+i.q).join('<br>')}</td><td>${rp(x.total)}</td><td>${rp(x.cash)}</td><td>${rp(x.change)}</td></tr>`).join('');let w=window.open('','_blank','width=900,height=700');w.document.write(`<html><head><title>Riwayat Rosea ${formatDay(getSelectedDate())}</title><style>body{font-family:Arial;margin:25px}h2{text-align:center}table{width:100%;border-collapse:collapse}th,td{border:1px solid #ccc;padding:7px;font-size:12px}th{background:#f7dce7}.sum{font-size:16px;font-weight:bold;text-align:right;margin:12px 0}</style></head><body><h2>🌹 ROSEA — RIWAYAT TRANSAKSI</h2><div style='text-align:center'>Tanggal: ${formatDay(getSelectedDate())}</div><div class='sum'>Total Penjualan: ${rp(totalDay)}</div><table><tr><th>Waktu</th><th>Pesanan</th><th>Total</th><th>Bayar</th><th>Kembalian</th></tr>${rows}</table><script>window.onload=()=>window.print()<\/script></body></html>`);w.document.close()}
async function clearHistory(){if(!history.length)return;if(confirm('Hapus semua riwayat transaksi? Data yang dihapus tidak dapat dikembalikan.')){await deleteAllTx();renderHistory()}}

function renderHistory(){let el=document.getElementById('histDate');if(el&&!el.value)el.value=new Date().toISOString().slice(0,10);let list=dayHistory();let totalDay=list.reduce((s,x)=>s+x.total,0);document.getElementById('hist').innerHTML=list.length?`<div style='margin-bottom:10px'><b>${formatDay(getSelectedDate())}</b> — ${list.length} transaksi — <b>Total ${rp(totalDay)}</b></div>`+list.map(x=>`<div class='history'><b>${x.time}</b><br>${x.items.map(i=>i.name+' x'+i.q).join(', ')}<br><b>${rp(x.total)}</b></div>`).join(''):'<div class="empty">Belum ada transaksi pada tanggal ini</div>'}
function tab(t){kasir.style.display=t==='kasir'?'block':'none';riwayat.style.display=t==='riwayat'?'block':'none';tk.classList.toggle('on',t==='kasir');th.classList.toggle('on',t==='riwayat');if(t==='riwayat')renderHistory()}renderQuick();render();drawCart();renderHistory();loadHistory();
</script></body></html>
